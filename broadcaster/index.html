<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Daystream — Go Live</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0a0a0a;
  --surface: #141414;
  --border:  #222;
  --red:     #ff3b3b;
  --green:   #00e676;
  --text:    #f0f0f0;
  --dim:     #666;
  --mid:     #999;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

/* ── Shell ── */
.shell { height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bot); }

/* ── Camera preview ── */
.preview-wrap { flex: 1; position: relative; background: #000; overflow: hidden; }
#preview { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#preview.screen-mode { transform: none; }

/* ── Live badge overlay ── */
.live-badge {
  position: absolute; top: 16px; left: 16px;
  background: var(--red); color: #fff;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  padding: 4px 10px; border-radius: 4px;
  display: none; align-items: center; gap: 6px;
}
.live-badge.show { display: flex; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.viewer-badge {
  position: absolute; top: 16px; right: 16px;
  background: #000a; color: #fff;
  font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 20px;
  display: none;
}
.viewer-badge.show { display: block; }

/* ── Source toggle ── */
.source-toggle {
  position: absolute; bottom: 16px; right: 16px;
  display: flex; background: #000a; border-radius: 24px; padding: 3px;
}
.src-btn {
  padding: 7px 14px; border-radius: 20px; border: none;
  background: transparent; color: var(--mid);
  font-size: 12px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.src-btn.active { background: var(--surface); color: var(--text); }

/* ── Comment feed overlay ── */
.comments-overlay {
  position: absolute; bottom: 16px; left: 16px; right: 80px;
  max-height: 180px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  pointer-events: none;
}
.comment-bubble {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: #000b; padding: 6px 10px; border-radius: 16px;
  font-size: 13px; max-width: 100%;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
.comment-author { color: var(--green); font-weight: 700; white-space: nowrap; }
.comment-text { color: #fff; word-break: break-word; }

/* ── Bottom panel ── */
.bottom { background: var(--surface); border-top: 1px solid var(--border); padding: 16px 20px; flex-shrink: 0; }

/* Setup state */
.setup { display: flex; flex-direction: column; gap: 14px; }
.field label { display: block; font-size: 12px; color: var(--mid); margin-bottom: 6px; font-weight: 600; }
.field input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  color: var(--text); font-size: 15px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--red); }
.field input::placeholder { color: var(--dim); }

.go-live-btn {
  width: 100%; padding: 16px;
  background: var(--red); color: #fff;
  border: none; border-radius: 14px;
  font-size: 17px; font-weight: 800; font-family: inherit;
  cursor: pointer; letter-spacing: -0.01em;
  transition: opacity 0.2s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.go-live-btn:active { opacity: 0.85; transform: scale(0.98); }
.go-live-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Live controls */
.live-controls { display: none; flex-direction: column; gap: 12px; }
.live-controls.show { display: flex; }
.setup.hide { display: none; }

.stats-row { display: flex; gap: 12px; }
.stat-pill {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; text-align: center;
}
.stat-val { font-size: 22px; font-weight: 800; color: var(--text); }
.stat-label { font-size: 11px; color: var(--dim); margin-top: 2px; font-weight: 600; }

.action-row { display: flex; gap: 10px; }
.action-btn {
  flex: 1; padding: 13px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.action-btn:hover { border-color: #444; }
.action-btn.whatsapp { background: #25d366; border-color: #25d366; color: #fff; }
.action-btn.end { background: transparent; border-color: var(--red); color: var(--red); }

/* Duration */
.duration { text-align: center; font-size: 13px; color: var(--mid); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="shell">

  <!-- Camera/screen preview -->
  <div class="preview-wrap">
    <video id="preview" autoplay muted playsinline></video>

    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div> LIVE
    </div>
    <div class="viewer-badge" id="viewerBadge">👁 0</div>

    <div class="source-toggle" id="sourceToggle" style="display:none">
      <button class="src-btn active" id="btnCamera" onclick="switchSource('camera')">📷 Camera</button>
      <button class="src-btn" id="btnScreen" onclick="switchSource('screen')">🖥 Screen</button>
    </div>

    <div class="comments-overlay" id="commentsOverlay"></div>
  </div>

  <!-- Bottom panel -->
  <div class="bottom">

    <!-- Setup -->
    <div class="setup" id="setup">
      <div class="field">
        <label>YOUR NAME</label>
        <input id="nameInput" type="text" placeholder="e.g. Kwame Mensah" maxlength="40">
      </div>
      <div class="field">
        <label>STREAM TITLE</label>
        <input id="titleInput" type="text" placeholder="What are you sharing today?" maxlength="60">
      </div>
      <button class="go-live-btn" id="goLiveBtn" onclick="goLive()">
        🔴 Go Live
      </button>
    </div>

    <!-- Live controls -->
    <div class="live-controls" id="liveControls">
      <div class="stats-row">
        <div class="stat-pill">
          <div class="stat-val" id="statViewers">0</div>
          <div class="stat-label">WATCHING</div>
        </div>
        <div class="stat-pill">
          <div class="stat-val" id="statComments">0</div>
          <div class="stat-label">COMMENTS</div>
        </div>
        <div class="stat-pill">
          <div class="stat-val" id="statDuration">0:00</div>
          <div class="stat-label">DURATION</div>
        </div>
      </div>
      <div class="action-row">
        <button class="action-btn whatsapp" id="shareBtn" onclick="shareToWhatsApp()">
          <span>Share to WhatsApp</span>
        </button>
        <button class="action-btn end" onclick="endStream()">End</button>
      </div>
    </div>

  </div>
</div>

<script>
const API = window.DALA_API || (location.origin);

let stream    = null;   // stream metadata from backend
let ws        = null;
let pc        = null;   // RTCPeerConnection
let mediaStream = null;
let durationTimer = null;
let startTime     = null;
let commentCount  = 0;
let sourceMode    = "camera";

// ── Boot: start camera immediately ───────────────────────────────────────────

async function initCamera() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true,
    });
    document.getElementById("preview").srcObject = mediaStream;
    document.getElementById("goLiveBtn").disabled = false;
  } catch (e) {
    alert("Camera access needed to go live. Please allow camera permission.");
  }
}

async function switchSource(mode) {
  sourceMode = mode;
  document.getElementById("btnCamera").classList.toggle("active", mode === "camera");
  document.getElementById("btnScreen").classList.toggle("active", mode === "screen");
  document.getElementById("preview").classList.toggle("screen-mode", mode === "screen");

  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

  if (mode === "camera") {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
  } else {
    try {
      const screen = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audio  = await navigator.mediaDevices.getUserMedia({ audio: true });
      const combined = new MediaStream([...screen.getVideoTracks(), ...audio.getAudioTracks()]);
      mediaStream = combined;
    } catch {
      switchSource("camera"); return;
    }
  }

  document.getElementById("preview").srcObject = mediaStream;

  // If already live, replace track in peer connection
  if (pc && stream?.status === "live") {
    const senders = pc.getSenders();
    for (const track of mediaStream.getTracks()) {
      const sender = senders.find(s => s.track?.kind === track.kind);
      if (sender) sender.replaceTrack(track);
    }
  }
}

// ── Go live ───────────────────────────────────────────────────────────────────

async function goLive() {
  const name  = document.getElementById("nameInput").value.trim() || "Broadcaster";
  const title = document.getElementById("titleInput").value.trim() || "Live";

  document.getElementById("goLiveBtn").disabled = true;
  document.getElementById("goLiveBtn").textContent = "Starting…";

  try {
    // 1. Create stream on backend
    const res = await fetch(`${API}/streams`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ broadcasterName: name, title }),
    });
    stream = await res.json();

    // 2. Connect WebSocket
    connectWs("broadcaster");

    // 3. Create peer connection
    await setupPeerConnection();

    // 4. Switch to live UI
    document.getElementById("setup").classList.add("hide");
    document.getElementById("liveControls").classList.add("show");
    document.getElementById("liveBadge").classList.add("show");
    document.getElementById("viewerBadge").classList.add("show");
    document.getElementById("sourceToggle").style.display = "flex";

    // 5. Start duration timer
    startTime = Date.now();
    durationTimer = setInterval(updateDuration, 1000);

    // 6. Auto-show share prompt
    setTimeout(shareToWhatsApp, 1200);

  } catch (e) {
    alert("Could not start stream. Check your connection.");
    document.getElementById("goLiveBtn").disabled = false;
    document.getElementById("goLiveBtn").textContent = "🔴 Go Live";
  }
}

async function setupPeerConnection() {
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ],
  });

  // Add local media tracks
  for (const track of mediaStream.getTracks()) {
    pc.addTrack(track, mediaStream);
  }

  pc.onicecandidate = ({ candidate }) => {
    if (candidate && ws) {
      ws.send(JSON.stringify({ type: "ice", streamId: stream.id, candidate }));
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  if (ws) {
    ws.send(JSON.stringify({ type: "offer", streamId: stream.id, sdp: offer }));
  }

  // Mark stream live
  await fetch(`${API}/streams/${stream.id}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "live" }),
  });
  stream.status = "live";
}

// ── WebSocket ─────────────────────────────────────────────────────────────────

function connectWs(role) {
  const wsUrl = API.replace("https://", "wss://").replace("http://", "ws://");
  ws = new WebSocket(`${wsUrl}/ws?streamId=${stream.id}&role=${role}`);

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "viewer_count") updateViewers(msg.count);
    if (msg.type === "comment")      showComment(msg.comment, true);
    if (msg.type === "reaction")     showReactionBurst(msg.emoji);
    if (msg.type === "answer" && pc) pc.setRemoteDescription(msg.sdp);
    if (msg.type === "ice" && pc)    pc.addIceCandidate(msg.candidate);
  };

  ws.onclose = () => { if (stream?.status === "live") setTimeout(() => connectWs(role), 2000); };
}

// ── Share ─────────────────────────────────────────────────────────────────────

function shareToWhatsApp() {
  if (!stream) return;
  window.open(stream.whatsappUrl, "_blank");
}

// ── End stream ────────────────────────────────────────────────────────────────

async function endStream() {
  if (!confirm("End your live stream?")) return;
  clearInterval(durationTimer);
  mediaStream?.getTracks().forEach(t => t.stop());
  pc?.close();
  ws?.close();
  await fetch(`${API}/streams/${stream.id}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "ended" }),
  });
  // Show summary
  alert(`Stream ended.\n👁 Peak viewers: ${stream?.peakViewers || 0}\n💬 Comments: ${commentCount}`);
  location.reload();
}

// ── UI helpers ────────────────────────────────────────────────────────────────

function updateViewers(count) {
  document.getElementById("statViewers").textContent  = count;
  document.getElementById("viewerBadge").textContent  = `👁 ${count}`;
  if (stream) stream.viewerCount = count;
}

function updateDuration() {
  const s   = Math.floor((Date.now() - startTime) / 1000);
  const m   = Math.floor(s / 60);
  const sec = s % 60;
  document.getElementById("statDuration").textContent = `${m}:${sec.toString().padStart(2, "0")}`;
}

function showComment(comment, fromWs = false) {
  commentCount++;
  document.getElementById("statComments").textContent = commentCount;

  const overlay = document.getElementById("commentsOverlay");
  const bubble  = document.createElement("div");
  bubble.className = "comment-bubble";
  bubble.innerHTML = `<span class="comment-author">${esc(comment.author)}</span><span class="comment-text">${esc(comment.text)}</span>`;
  overlay.appendChild(bubble);

  // Keep only last 4 bubbles
  while (overlay.children.length > 4) overlay.removeChild(overlay.firstChild);
  setTimeout(() => bubble.remove(), 8000);
}

function showReactionBurst(emoji) {
  // Simple floating emoji
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;pointer-events:none;font-size:28px;
    left:${20 + Math.random()*60}%;bottom:120px;animation:floatUp 1.5s ease forwards;z-index:99`;
  el.textContent = { fire:"🔥", heart:"❤️", clap:"👏", wow:"😮" }[emoji] || "❤️";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Float-up keyframe injected once
const style = document.createElement("style");
style.textContent = `@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-120px)} }`;
document.head.appendChild(style);

// Boot
initCamera();
</script>
</body>
</html>
