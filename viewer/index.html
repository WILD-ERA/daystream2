<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Daystream Live</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #000;
  --red:   #ff3b3b;
  --green: #00e676;
  --text:  #f0f0f0;
  --dim:   #555;
  --mid:   #888;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }

/* ── Shell ── */
.shell { height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-top); padding-bottom: var(--safe-bot); position: relative; }

/* ── Video ── */
.video-wrap { flex: 1; position: relative; background: #000; overflow: hidden; }
#liveVideo { width: 100%; height: 100%; object-fit: cover; }

/* ── Ad overlay ── */
.ad-overlay {
  position: absolute; inset: 0;
  background: #000;
  display: none; flex-direction: column;
  z-index: 50;
}
.ad-overlay.show { display: flex; }
#adVideo { width: 100%; flex: 1; object-fit: contain; background: #000; }
.ad-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #000a;
  position: absolute; top: 0; left: 0; right: 0;
}
.ad-label { font-size: 11px; color: var(--mid); font-weight: 600; letter-spacing: 0.06em; }
.ad-skip {
  background: #fff3; border: none; border-radius: 4px;
  padding: 5px 12px; color: #fff; font-size: 12px; font-family: inherit;
  cursor: pointer; font-weight: 600;
}
.ad-skip:disabled { opacity: 0.4; cursor: not-allowed; }
.ad-cta {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--red); color: #fff; border: none;
  padding: 12px 28px; border-radius: 24px;
  font-size: 14px; font-weight: 700; font-family: inherit;
  cursor: pointer; white-space: nowrap;
}

/* ── Top bar ── */
.top-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(to bottom, #000c 0%, transparent 100%);
}
.broadcaster-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #ff3b3b, #ff8c00);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.broadcaster-info { flex: 1; }
.broadcaster-name { font-size: 14px; font-weight: 700; }
.stream-title { font-size: 11px; color: var(--mid); margin-top: 1px; }
.live-pill {
  background: var(--red); color: #fff;
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 4px;
  display: flex; align-items: center; gap: 4px;
}
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.viewer-count { font-size: 12px; color: var(--mid); font-weight: 600; }

/* ── Comments ── */
.comments-wrap {
  position: absolute; bottom: 80px; left: 0; right: 0;
  max-height: 220px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 12px; gap: 6px; pointer-events: none;
}
.comment {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: #000b; backdrop-filter: blur(4px);
  padding: 7px 12px; border-radius: 18px;
  font-size: 13px; max-width: 85%; align-self: flex-start;
  animation: slideUp 0.25s ease;
  pointer-events: auto;
}
@keyframes slideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.c-author { color: var(--green); font-weight: 700; white-space: nowrap; }
.c-text   { color: #fff; }

/* ── Reactions float ── */
.reaction-float {
  position: absolute; left: 16px; bottom: 100px;
  display: flex; flex-direction: column-reverse; gap: 4px;
  pointer-events: none; z-index: 20;
}

/* ── Bottom bar ── */
.bottom-bar {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
  background: linear-gradient(to top, #000e 0%, transparent 100%);
  padding: 12px 12px calc(12px + var(--safe-bot));
}
.comment-row { display: flex; gap: 8px; align-items: center; }
.comment-input {
  flex: 1; background: #ffffff18; border: 1px solid #ffffff22;
  border-radius: 24px; padding: 10px 16px;
  color: var(--text); font-size: 14px; font-family: inherit;
  outline: none;
}
.comment-input::placeholder { color: var(--dim); }
.send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--green); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.reaction-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.react-btn {
  flex: 1; padding: 9px; border-radius: 12px;
  background: #ffffff12; border: none; cursor: pointer;
  font-size: 20px; transition: transform 0.1s;
}
.react-btn:active { transform: scale(1.3); }

/* ── Ended screen ── */
.ended-screen {
  position: absolute; inset: 0; background: #000d;
  display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  z-index: 60; text-align: center; padding: 40px;
}
.ended-screen.show { display: flex; }
.ended-screen h2 { font-size: 26px; font-weight: 800; }
.ended-screen p  { color: var(--mid); font-size: 15px; }

/* ── Loading ── */
.loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 5;
}
.loading-spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid #222; border-top-color: var(--red);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { color: var(--mid); font-size: 14px; }
</style>
</head>
<body>
<div class="shell">
  <div class="video-wrap">

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <p>Joining stream…</p>
    </div>

    <!-- Live video -->
    <video id="liveVideo" autoplay playsinline></video>

    <!-- Ad overlay -->
    <div class="ad-overlay" id="adOverlay">
      <div class="ad-bar">
        <span class="ad-label">AD</span>
        <button class="ad-skip" id="adSkipBtn" disabled onclick="skipAd()">Skip in <span id="adCountdown">5</span>s</button>
      </div>
      <video id="adVideo" autoplay playsinline muted></video>
      <button class="ad-cta" id="adCta" onclick="adClick()">Learn More</button>
    </div>

    <!-- Top bar -->
    <div class="top-bar" id="topBar" style="display:none">
      <div class="broadcaster-avatar" id="broadcasterAvatar">?</div>
      <div class="broadcaster-info">
        <div class="broadcaster-name" id="broadcasterName">Loading…</div>
        <div class="stream-title" id="streamTitle"></div>
      </div>
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
      <div class="viewer-count" id="viewerCount">👁 0</div>
    </div>

    <!-- Comments -->
    <div class="comments-wrap" id="commentsWrap"></div>

    <!-- Ended -->
    <div class="ended-screen" id="endedScreen">
      <div style="font-size:48px">📡</div>
      <h2>Stream ended</h2>
      <p>Thanks for watching on Daystream</p>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar" id="bottomBar" style="display:none">
      <div class="comment-row">
        <input class="comment-input" id="commentInput" type="text" placeholder="Say something…" maxlength="120">
        <button class="send-btn" onclick="sendComment()">➤</button>
      </div>
      <div class="reaction-row">
        <button class="react-btn" onclick="sendReaction('fire')">🔥</button>
        <button class="react-btn" onclick="sendReaction('heart')">❤️</button>
        <button class="react-btn" onclick="sendReaction('clap')">👏</button>
        <button class="react-btn" onclick="sendReaction('wow')">😮</button>
      </div>
    </div>

  </div>
</div>

<script>
const API = window.DALA_API || (location.origin);

// Extract stream ID from URL: /watch/:id
const streamId = location.pathname.split("/").filter(Boolean).pop();
let ws   = null;
let pc   = null;
let meta = null;
let viewerName = "Viewer";
let adTimer = null;

// ── Boot ──────────────────────────────────────────────────────────────────────

async function boot() {
  if (!streamId) { document.getElementById("loading").querySelector("p").textContent = "Invalid stream link."; return; }

  // Prompt for name
  const name = prompt("Your name (shown in comments):", "") || "Viewer";
  viewerName = name.trim() || "Viewer";

  // Load stream metadata
  try {
    const res = await fetch(`${API}/streams/${streamId}`);
    meta = await res.json();
  } catch {
    document.getElementById("loading").querySelector("p").textContent = "Could not load stream.";
    return;
  }

  if (meta.status === "ended") { showEnded(); return; }

  // Show ad first
  await showPrerollAd();

  // Connect
  connectWs();
  setupWebRTC();
  showUI();
}

// ── Ad ────────────────────────────────────────────────────────────────────────

async function showPrerollAd() {
  return new Promise(resolve => {
    fetch(`${API}/ads`).then(r => r.json()).then(ad => {
      const overlay  = document.getElementById("adOverlay");
      const video    = document.getElementById("adVideo");
      const skipBtn  = document.getElementById("adSkipBtn");
      const countdown = document.getElementById("adCountdown");
      const cta      = document.getElementById("adCta");

      cta.textContent   = ad.cta;
      video.src         = ad.videoUrl;
      overlay.classList.add("show");

      let remaining = ad.skipAfter;
      adTimer = setInterval(() => {
        remaining--;
        countdown.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(adTimer);
          skipBtn.disabled    = false;
          skipBtn.textContent = "Skip ›";
        }
      }, 1000);

      skipBtn.onclick = () => {
        clearInterval(adTimer);
        overlay.classList.remove("show");
        resolve();
      };

      video.onended = () => {
        clearInterval(adTimer);
        overlay.classList.remove("show");
        resolve();
      };

    }).catch(resolve); // if ad fails, proceed anyway
  });
}

function adClick() {
  window.open(document.getElementById("adCta").dataset.url || "https://daystream.live/advertise", "_blank");
}

function skipAd() {} // handled inline above

// ── WebSocket ─────────────────────────────────────────────────────────────────

function connectWs() {
  const wsUrl = API.replace("https://", "wss://").replace("http://", "ws://");
  ws = new WebSocket(`${wsUrl}/ws?streamId=${streamId}&role=viewer`);

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "init")         updateMeta(msg.stream);
    if (msg.type === "stream_live")  { /* already live */ }
    if (msg.type === "stream_ended") showEnded();
    if (msg.type === "viewer_count") document.getElementById("viewerCount").textContent = `👁 ${msg.count}`;
    if (msg.type === "comment")      addComment(msg.comment);
    if (msg.type === "reaction")     floatReaction(msg.emoji);
    if (msg.type === "offer" && pc)  handleOffer(msg.sdp);
    if (msg.type === "ice" && pc)    pc.addIceCandidate(msg.candidate).catch(() => {});
  };

  ws.onclose = () => setTimeout(connectWs, 2000);
}

// ── WebRTC ────────────────────────────────────────────────────────────────────

function setupWebRTC() {
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ],
  });

  pc.ontrack = e => {
    const video = document.getElementById("liveVideo");
    if (!video.srcObject) video.srcObject = new MediaStream();
    video.srcObject.addTrack(e.track);
    document.getElementById("loading").style.display = "none";
  };

  pc.onicecandidate = ({ candidate }) => {
    if (candidate && ws) ws.send(JSON.stringify({ type: "ice", streamId, candidate }));
  };
}

async function handleOffer(sdp) {
  await pc.setRemoteDescription(sdp);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  if (ws) ws.send(JSON.stringify({ type: "answer", streamId, sdp: answer }));
}

// ── UI ────────────────────────────────────────────────────────────────────────

function showUI() {
  updateMeta(meta);
  document.getElementById("topBar").style.display    = "flex";
  document.getElementById("bottomBar").style.display = "block";
}

function updateMeta(s) {
  if (!s) return;
  meta = s;
  document.title = `${s.broadcasterName} — Daystream Live`;
  document.getElementById("broadcasterName").textContent = s.broadcasterName;
  document.getElementById("streamTitle").textContent     = s.title;
  document.getElementById("broadcasterAvatar").textContent = s.broadcasterName?.[0]?.toUpperCase() || "?";
  document.getElementById("viewerCount").textContent = `👁 ${s.viewerCount || 0}`;
  if (s.comments) s.comments.slice(-5).forEach(addComment);
}

function addComment(c) {
  const wrap = document.getElementById("commentsWrap");
  const el   = document.createElement("div");
  el.className = "comment";
  el.innerHTML = `<span class="c-author">${esc(c.author)}</span><span class="c-text">${esc(c.text)}</span>`;
  wrap.appendChild(el);
  while (wrap.children.length > 5) wrap.removeChild(wrap.firstChild);
  setTimeout(() => el.remove(), 10000);
}

function floatReaction(emoji) {
  const map = { fire:"🔥", heart:"❤️", clap:"👏", wow:"😮" };
  const el  = document.createElement("div");
  el.style.cssText = `position:fixed;pointer-events:none;font-size:30px;left:${10+Math.random()*30}%;bottom:120px;animation:floatUp 1.6s ease forwards;z-index:99`;
  el.textContent = map[emoji] || "❤️";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

function sendComment() {
  const input = document.getElementById("commentInput");
  const text  = input.value.trim();
  if (!text || !ws) return;
  ws.send(JSON.stringify({ type: "comment", streamId, author: viewerName, text }));
  input.value = "";
  addComment({ author: viewerName, text }); // optimistic
}

document.getElementById("commentInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendComment();
});

function sendReaction(emoji) {
  if (!ws) return;
  ws.send(JSON.stringify({ type: "reaction", streamId, emoji }));
  floatReaction(emoji);
}

function showEnded() {
  document.getElementById("endedScreen").classList.add("show");
  document.getElementById("topBar").style.display    = "none";
  document.getElementById("bottomBar").style.display = "none";
  document.getElementById("loading").style.display   = "none";
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const style = document.createElement("style");
style.textContent = `@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-140px)}}`;
document.head.appendChild(style);

boot();
</script>
</body>
</html>
